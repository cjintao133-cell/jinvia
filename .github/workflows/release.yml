name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions: read-all

jobs:
  package:
    name: build & package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build (bin + libs)
        run: make && make lib
      - name: Package (tarball + checksums)
        run: |
          mkdir -p dist
          tar czf "dist/jinvia-${{ github.ref_name }}.tar.gz" \
            jinvia build/libjinvia.a build/libjinvia.so include examples README.md README.en.md LICENSE
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -l dist
      - name: Publish release (attach artifacts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Jinvia ${{ github.ref_name }}" \
            --notes "See CHANGELOG.md for details. Verified by CI (gcc/clang, ASan/UBSan, Valgrind, x86-32, aarch64-QEMU)." \
            || gh release upload "${{ github.ref_name }}" dist/* --clobber
