name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions: read-all

jobs:
  package:
    name: build & package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build (bin + libs)
        run: make && make lib
      - name: Package (tarball + checksums)
        run: |
          mkdir -p dist
          tar czf "dist/jinvia-${{ github.ref_name }}.tar.gz" \
            jinvia build/libjinvia.a build/libjinvia.so include examples README.md README.en.md LICENSE SECURITY.md CHANGELOG.md
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -l dist
      - name: Publish release (attach artifacts)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          name: Jinvia ${{ github.ref_name }}
          draft: false
          prerelease: false
