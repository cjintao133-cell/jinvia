# OpenSSF Scorecard —— 公开仓库后启用：把本文件复制到 .github/workflows/scorecard.yml
# 徽章：https://api.securityscorecards.dev/projects/github.com/cjintao133-cell/jinvia/badge
name: OpenSSF Scorecard
on:
  workflow_dispatch:   # 可手动重跑（GCR 偶发不可用时用它重试）
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 1'
  push:
    branches: [ main ]
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: SARIF
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
